<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>คลังความรู้ Digital Factsheet โรคและภัยสุขภาพ กรมควบคุมโรค</title>
  <meta name="description" content="คลังความรู้ Digital Factsheet โรคและภัยสุขภาพ กรมควบคุมโรค">

  <!-- Health Factsheet Favicon -->
  <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4d6.png">
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f4d6.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a192f;
      font-family: 'Sarabun', sans-serif;
      /* ป้องกันการเด้งหรือยืดหดของจอมือถือเวลาเลื่อน */
      position: fixed; 
    }

    .iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* รองรับความสูงเต็มจอแบบ Dynamic บนมือถือ (iOS/Android) */
      height: 100dvh; 
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbzi4MZ0z0Aq6_JfJzasMetNL9tp6qzuFDSIpV7kPDH-lQaj6JeelYTN2IeFN_3XIcAuKw/exec"
      title="ระบบสืบค้นข้อมูลแนวทางรู้ทันโรคและภัยสุขภาพ Digital Factsheet"
      allow="clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
